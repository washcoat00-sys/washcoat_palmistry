
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Palm Reader - 스마트 손금 분석</title>
    <link rel="stylesheet" href="style.css">
    <!-- MediaPipe Hands for auto-detection and landmarking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>AI Palm Reader</h1>
        <button id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </header>
    <main>
        <section class="intro">
            <p><strong>스마트 AI가 당신의 손금을 자동으로 찾아 드립니다.</strong><br>양손 사진을 함께 올리면 자동으로 좌우를 구별하고 주요 선들을 분석합니다.</p>
        </section>

        <section class="user-info">
            <div class="input-group">
                <label>성별</label>
                <div class="gender-selection">
                    <input type="radio" id="male" name="gender" value="male" checked>
                    <label for="male">남성</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">여성</label>
                </div>
            </div>
            <div class="input-group">
                <label for="age">만 나이</label>
                <input type="number" id="age" min="1" max="120" value="25">
            </div>
        </section>

        <div class="unified-upload-section" id="dropZone">
            <label for="palmImages" class="custom-file-upload">
                📸 양손 사진 업로드 (한 번에 선택 또는 드롭)
            </label>
            <input type="file" id="palmImages" accept="image/*" multiple>
            <p class="upload-hint">사진을 올리면 AI가 자동으로 왼손/오른손을 판별합니다.</p>
        </div>

        <div class="analysis-container">
            <div class="analysis-box" id="boxLeft">
                <div class="box-header">✋ 왼손 (선천운)</div>
                <div class="canvas-wrapper">
                    <canvas id="canvasLeft"></canvas>
                    <div id="previewLeft" class="preview-placeholder">대기 중...</div>
                </div>
            </div>
            <div class="analysis-box" id="boxRight">
                <div class="box-header">✋ 오른손 (후천운)</div>
                <div class="canvas-wrapper">
                    <canvas id="canvasRight"></canvas>
                    <div id="previewRight" class="preview-placeholder">대기 중...</div>
                </div>
            </div>
        </div>

        <div class="action-section">
            <button id="analyzeBtn" class="primary-btn" disabled>분석을 위해 사진을 올려주세요</button>
        </div>

        <div id="result" class="result-section"></div>
    </main>
    <footer>
        <p>&copy; 2026 AI Palm Reader | 운명은 당신의 손안에 있습니다.</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
