
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Palm Reader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AI Palm Reader</h1>
        <button id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </header>
    <main>
        <section class="intro">
            <p>당신의 손바닥에 숨겨진 운명의 지도를 발견하세요. AI 손금 분석으로 당신의 성격, 건강, 그리고 미래의 가능성을 엿볼 수 있습니다.</p>
        </section>
        <div class="upload-section">
            <label for="palmImage" class="custom-file-upload">
                📸 손금 사진 업로드
            </label>
            <input type="file" id="palmImage" accept="image/*">
            <div id="imagePreviewContainer"></div>
            <button id="analyzeBtn">분석 시작하기</button>
        </div>
        <div id="result" class="result-section"></div>
    </main>
    <footer>
        <p>&copy; 2026 AI Palm Reader | 운명은 당신의 손안에 있습니다.</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
